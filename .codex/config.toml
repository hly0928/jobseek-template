[agents]
enabled = true
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
max_concurrent_threads_per_session = 3
max_depth = 1

[agents.jobseek_discovery_assess]
description = "Search, deduplicate, open complete advertisements, and perform ordinary assessment."
config_file = "agents/jobseek-discovery-assess.toml"

[agents.jobseek_audit]
description = "Audit exceptional eligibility questions or unclear submission confirmation."
config_file = "agents/jobseek-audit.toml"

[agents.jobseek_materials]
description = "Prepare and visually verify truthful application materials."
config_file = "agents/jobseek-materials.toml"

[agents.jobseek_submission]
description = "Prepare form review, pause for approval, submit once, and record confirmation."
config_file = "agents/jobseek-submission.toml"
